name: Build iOS Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Pilih mode build APK (tanpa perlu keystore)'
        required: true
        default: 'debug_apk'
        type: choice
        options:
          - debug_apk
          - test_and_debug_apk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        if: ${{ hashFiles('debug.keystore.base64') != '' }}
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Make gradlew executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Run Unit Tests (optional)
        if: ${{ github.event.inputs.build_mode == 'test_and_debug_apk' }}
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Build Debug APK (Ready to Install)
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
